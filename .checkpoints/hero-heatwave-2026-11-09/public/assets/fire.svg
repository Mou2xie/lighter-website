<svg class="fire-art" viewBox="770 -68 420 460" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
<style>
  /* A slow heat front climbs the fixed tile grid; the four tip tiles drift like embers. */
  /* .cN = palette entry, .tN = row from the top, .sN = tip ember. */
  @media (prefers-reduced-motion: no-preference) {
    .c0 { animation: heat-0 5.2s ease-in-out infinite; }
    .c1 { animation: heat-1 5.2s ease-in-out infinite; }
    .c2 { animation: heat-2 5.2s ease-in-out infinite; }
    .c3 { animation: heat-3 5.2s ease-in-out infinite; }
    .t2 { animation-delay: 0s; }
    .t3 { animation-delay: -.26s; }
    .t4 { animation-delay: -.52s; }
    .t5 { animation-delay: -.78s; }
    .t6 { animation-delay: -1.04s; }
    .t7 { animation-delay: -1.3s; }
    .t8 { animation-delay: -1.56s; }
    .t9 { animation-delay: -1.82s; }
    .t10 { animation-delay: -2.08s; }
    .spark { animation: ember 7.6s ease-in-out infinite; }
    .s1 { animation-duration: 7.6s; animation-delay: -1.1s; }
    .s2 { animation-duration: 8.2s; animation-delay: -3.4s; }
    .s3 { animation-duration: 9.4s; animation-delay: -5.2s; }
    .s4 { animation-duration: 10.8s; animation-delay: -7.6s; }
  }
  @keyframes heat-0 {
    0%, 36% { fill: #4c3022; }
    43% { fill: #7a4d2c; }
    50%, 100% { fill: #4c3022; }
  }
  @keyframes heat-1 {
    0%, 36% { fill: #9c411e; }
    43% { fill: #c95520; }
    50%, 100% { fill: #9c411e; }
  }
  @keyframes heat-2 {
    0%, 36% { fill: #f5460b; }
    43% { fill: #ff7a2e; }
    50%, 100% { fill: #f5460b; }
  }
  @keyframes heat-3 {
    0%, 36% { fill: #f59e0b; }
    43% { fill: #ffcc4d; }
    50%, 100% { fill: #f59e0b; }
  }
  @keyframes ember {
    0%, 100% { opacity: 1; transform: translateY(0); }
    45% { opacity: .66; transform: translateY(-6px); }
    62% { opacity: .9; transform: translateY(-2px); }
  }
</style>
