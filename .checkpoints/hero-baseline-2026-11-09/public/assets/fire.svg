<svg class="fire-art" viewBox="770 -68 420 460" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
<style>
  @media (prefers-reduced-motion: no-preference) {
    path { animation: flame-flicker 3.6s ease-in-out infinite; }
    path:nth-of-type(3n) { animation-duration: 4.2s; animation-delay: -1.4s; }
    path:nth-of-type(3n + 1) { animation-delay: -2.6s; }
    path:nth-of-type(5n) { animation-duration: 3.2s; animation-delay: -.8s; }
    path:nth-of-type(-n + 4) { animation-name: flame-tip; }
  }
  @keyframes flame-flicker {
    0%, 100% { opacity: .78; transform: translateY(0); }
    45% { opacity: 1; transform: translateY(-4px); }
    70% { opacity: .9; transform: translateY(-1px); }
  }
  @keyframes flame-tip {
    0%, 100% { opacity: .55; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-8px); }
  }
</style>
